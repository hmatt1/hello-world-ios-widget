name: iOS Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          # A tag names the version; anything else is not a release and says so.
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || VERSION="0.0.0"

          xcodebuild clean archive \
            -project LauncherBoard.xcodeproj \
            -scheme LauncherBoard \
            -destination "generic/platform=iOS" \
            -archivePath LauncherBoard.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir Payload
          cp -R LauncherBoard.xcarchive/Products/Applications/LauncherBoard.app Payload/
          zip -qr LauncherBoard.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LauncherBoard-IPA
          path: LauncherBoard.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LauncherBoard.ipa
            App/LauncherBoard.entitlements
            Widget/LauncherBoardWidget.entitlements
