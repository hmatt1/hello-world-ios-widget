name: iOS Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Beta
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-beta

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild clean archive \
            -project HelloWorldApp.xcodeproj \
            -scheme HelloWorldApp \
            -destination "generic/platform=iOS" \
            -archivePath HelloWorldApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          mkdir Payload
          cp -R HelloWorldApp.xcarchive/Products/Applications/HelloWorldApp.app Payload/
          zip -qr HelloWorldApp.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: HelloWorldApp-IPA
          path: HelloWorldApp.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: HelloWorldApp.ipa
